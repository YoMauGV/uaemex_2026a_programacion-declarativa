services:
  web:
    build: .
    container_name: Apache
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html:ro
    environment:
      # Pasa variables de entorno al contenedor
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_network
    # Limites de recursos para Apache
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: ${MEMORY_LIMIT:-512m}
        reservations:
          memory: ${MEMORY_RESERVATION:-256m}
    # Health check para verificar que Apache está respondiendo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logs estructurados
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Seguridad: solo lectura del sistema de archivos
    security_opt:
      - no-new-privileges:true
    # Deshabilita capacidades peligrosas
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  db:
    image: mariadb:11
    container_name: MariaDB
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      # Mejor performance y seguridad
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      # Datos persistentes
      - mariadb_data:/var/lib/mysql
      # Script de inicialización (crea tablas e inserta datos)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lamp_network
    # Limites de recursos para MariaDB
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: ${MEMORY_LIMIT:-512m}
        reservations:
          memory: ${MEMORY_RESERVATION:-256m}
    # Health check para verificar que MariaDB está listo
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Solo accesible desde dentro de la red de Docker, NO expuesto a internet
    # ports:
    #   - "3306:3306"
    # Logs estructurados
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Seguridad
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: PHPMyAdmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
      # Seguridad
      PMA_ABSOLUTE_URI: http://localhost:${PHPMYADMIN_PORT:-8080}/
      # Limita a solo lectura para mayor seguridad (opcional)
      # PMA_USER_CONFIG_BASE: /etc/phpmyadmin/config.user.inc.php
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_network
    # Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '256m'
        reservations:
          memory: '128m'
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Logs estructurados
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Seguridad
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

# Red interna para comunicación segura entre contenedores
networks:
  lamp_network:
    name: lamp_network
    driver: bridge
    # Aislamiento de red
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumen persistente para datos de MariaDB
volumes:
  mariadb_data:
    driver: local
