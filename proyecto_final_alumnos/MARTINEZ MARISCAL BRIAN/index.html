<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla Periódica</title>
    <link rel="stylesheet" href="../../../../Working%20files/BRIAN%20MARTINEZ%20MARISCAL/Proyecto%20Final/styles.css" />
  </head>
  <body>
    <header>
      <h1>Tabla Periódica de los Elementos</h1>
    </header>

    <section class="filtros">
      <input type="text" id="searchInput" placeholder="Buscar elemento..." />
      <select id="categoryFilter">
        <option value="">Categoría</option>
      </select>
      <select id="originFilter">
        <option value="">Origen</option>
      </select>
      <select id="periodFilter">
        <option value="">Periodo</option>
      </select>
      <select id="groupFilter">
        <option value="">Grupo</option>
      </select>
      <button id="clearFilters">Limpiar</button>
    </section>

    <section id="legend" class="leyenda"></section>

    <main class="contenedor-tabla">
      <div id="periodicTable" class="tabla-periodica"></div>
    </main>

    <!-- Modal se abre con JS cuando haces click en un elemento -->
    <div
      id="elementModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div class="modal-contenido">
        <button
          id="closeModal"
          class="cerrar"
          aria-label="Cerrar detalle del elemento"
        >
          &times;
        </button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="../../../../Working%20files/BRIAN%20MARTINEZ%20MARISCAL/Proyecto%20Final/main.js"></script>
  </body>
</html>
