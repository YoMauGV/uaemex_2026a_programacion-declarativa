<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tabla Periódica</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="header-cartel">

        <h1 class="titulo-izq">
            TABLA PERIÓDICA
        </h1>

        <p class="subtitulo">
            Programación Declarativa - Denise Cuevas
        </p>

    </header>

    <div class="filtros-container">

        <div class="inputs-row">

            <div class="filter-group">

                <label>Categoría</label>
                <select id="filter-categoria">
                    <option value="todas">
                        Todas
                    </option>
                    <option value="metales-alcalinos">
                        M. Alcalinos
                    </option>
                    <option value="alcalinoterreos">
                        Alcalinotérreos
                    </option>
                    <option value="metales-transicion">
                        M. Transición
                    </option>

                    <option value="metaloides">
                        Metaloides
                    </option>

                    <option value="no-metales">
                        No Metales
                    </option>
                    <option value="halogenos">
                        Halógenos
                    </option>
                    <option value="gases-nobles">
                        Gases Nobles
                    </option>
                    <option value="lantanidos">
                        Lantánidos
                    </option>
                    <option value="actinidos">
                        Actínidos
                    </option>
                </select>
            </div>

            <div class="filter-group">

                <label>Origen</label>

                <select id="filter-origen">

                    <option value="todos">
                        Todos
                    </option>

                    <option value="natural">
                        Natural
                    </option>

                    <option value="sintetico">
                        Sintético
                    </option>

                </select>

            </div>

            <div class="filter-group">

                <label>Descubridor</label>

                <input
                    type="text"
                    id="filter-descubridor"
                    placeholder="Ej. Curie"
                >

            </div>

            <button id="btn-aplicar">
                Aplicar
            </button>

            <button id="btn-limpiar">
                Limpiar
            </button>

        </div>

    </div>

    <main
        id="tabla-principal"
        class="tabla-grid"
    ></main>

    <section
        id="tabla-inferior"
        class="tabla-grid-inferior"
    ></section>

    <div
        id="modal-elemento"
        class="modal-overlay"
    >

        <div class="modal-content">

            <span
                id="modal-cerrar"
                class="btn-cerrar"
            >
                &times;
            </span>

            <div class="modal-header-info">

                <div>
                    <h3 id="modal-num"></h3>
                </div>

                <div>
                    <h3 id="modal-masa"></h3>
                </div>

            </div>

            <div class="modal-center-block">

                <h1 id="modal-simbolo"></h1>

                <h2 id="modal-nombre"></h2>

            </div>

            <div class="modal-footer-grid">

                <div>

                    <strong>
                        Configuración:
                    </strong>

                    <p id="modal-config"></p>

                </div>

                <div>

                    <p id="modal-coordenadas"></p>

                    <p id="modal-familia-texto"></p>

                </div>

            </div>

            <div class="modal-extra-info">

                <p>

                    <strong>
                        Descubridor:
                    </strong>

                    <span id="modal-descubridor"></span>

                </p>

                <p>

                    <strong>
                        Origen:
                    </strong>

                    <span id="modal-origen"></span>

                </p>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
