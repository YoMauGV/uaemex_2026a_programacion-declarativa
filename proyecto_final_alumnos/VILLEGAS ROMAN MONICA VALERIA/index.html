<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../../Working%20files/MONICA%20VALERIA%20VILLEGAS%20ROMAN/Proyecto%20Final/styles.css">
</head>
<body>

    <div class="container-fluid py-4">
        <h1 class="text-center mb-4 font-weight-bold">Tabla periodica</h1>

        <div class="filter-container">
            <span class="filter-label">Filtrar por categoría:</span>
            <button class="btn-filter" onclick="filterElements('all')">Todos</button>
            <button class="btn-filter f-alcalino" onclick="filterElements('metal-alcalino')">Metales Alcalinos</button>
            <button class="btn-filter f-alcalinoterreo" onclick="filterElements('metal-alcalinoterreo')">Alcalinotérreos</button>
            <button class="btn-filter f-transicion" onclick="filterElements('metal-transicion')">Metales de Transición</button>
            <button class="btn-filter f-lantanido" onclick="filterElements('lantanido')">Lantánidos</button>
            <button class="btn-filter f-actinido" onclick="filterElements('actinido')">Actínidos</button>
            <button class="btn-filter f-metal" onclick="filterElements('metal')">Otros Metales</button>
            <button class="btn-filter f-metaloide" onclick="filterElements('metaloide')">Metaloides</button>
            <button class="btn-filter f-no-metal" onclick="filterElements('no-metal')">No Metales</button>
            <button class="btn-filter f-halogeno" onclick="filterElements('halogeno')">Halógenos</button>
            <button class="btn-filter f-gas-noble" onclick="filterElements('gas-noble')">Gases Nobles</button>
        </div>

        <div id="table-container"></div>
    </div>

    <div class="modal fade" id="elementModal" tabindex="-1" aria-labelledby="elementModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" id="modal-content-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="elementModalLabel">Detalles del Elemento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="elementModalBody">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../../Working%20files/MONICA%20VALERIA%20VILLEGAS%20ROMAN/Proyecto%20Final/script.js"></script>
</body>
</html>
