<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica Interactiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+GB+S+Guides:ital@0;1&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="../../../../Working%20files/ANDREA%20MICHELL%20MARCELINO%20SOTERO/Proyecto%20Final/style.css">
</head>
<body>

    <header>
        <h1>Tabla Periódica de los Elementos</h1>
        <p id="status-message">Cargando datos de la API...</p>
        
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="Buscar por nombre o símbolo...">
            
            <select id="filter-select">
                <option value="all">Todas las categorías</option>
                <option value="alkali-metal">Metales Alcalinos</option>
                <option value="alkaline-earth-metal">Alcalinotérreos</option>
                <option value="transition-metal">Metales de Transición</option>
                <option value="post-transition-metal">Otros Metales</option>
                <option value="metalloid">Metaloides</option>
                <option value="diatomic-nonmetal">No Metales Diatómicos</option>
                <option value="polyatomic-nonmetal">No Metales Poliatómicos</option>
                <option value="noble-gas">Gases Nobles</option>
                <option value="lanthanide">Lantánidos</option>
                <option value="actinide">Actínidos</option>
            </select>
        </div>
    </header>

    <main class="table-container">
        <div id="periodic-table" class="periodic-table"></div>
    </main>

    <div id="element-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="../../../../Working%20files/ANDREA%20MICHELL%20MARCELINO%20SOTERO/Proyecto%20Final/app.js"></script>
</body>
</html>
